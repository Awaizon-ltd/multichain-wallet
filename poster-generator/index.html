<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Poster Generator</title>
    <link rel="icon" href="data:," />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
        }
      }
    </script>
    <style>
      :root {
        --bg: #0b0b0c;
        --panel: #141416;
        --line: #2a2a2e;
        --text: #f3f3f4;
        --soft: #a3a3aa;
        --accent: #d6fa1b;
        color-scheme: dark;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 15px/1.5 Inter, system-ui, sans-serif; }
      .app { display: grid; grid-template-columns: 320px minmax(0, 1fr); min-height: 100%; }
      aside { border-right: 1px solid var(--line); background: var(--panel); padding: 24px; display: flex; flex-direction: column; gap: 18px; }
      h1 { margin: 0; font-size: 18px; font-weight: 800; letter-spacing: -0.02em; }
      h1 small { display: block; margin-top: 2px; font-size: 13px; font-weight: 500; color: var(--soft); letter-spacing: 0; }
      label { display: grid; gap: 6px; font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--soft); }
      input, select { width: 100%; min-height: 42px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line); background: #0e0e10; color: var(--text); font: 500 15px Inter, sans-serif; text-transform: none; letter-spacing: 0; }
      input { font-family: "JetBrains Mono", monospace; }
      input:focus-visible, select:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
      button { min-height: 44px; border-radius: 999px; border: 1px solid var(--line); background: #1c1c20; color: var(--text); font: 700 14px Inter, sans-serif; cursor: pointer; }
      button:hover { background: #24242a; }
      button.primary { background: var(--accent); border-color: transparent; color: #0a0a0a; }
      button.primary:hover { filter: brightness(1.06); }
      button:disabled { opacity: 0.5; cursor: progress; }
      fieldset.campaign { margin: 0; padding: 14px; border: 1px solid var(--line); border-radius: 12px; display: grid; gap: 10px; }
      fieldset.campaign legend { padding: 0 6px; font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--soft); }
      fieldset.campaign legend small { display: block; font-weight: 500; letter-spacing: 0; text-transform: none; }
      fieldset.campaign input { font-family: Inter, sans-serif; min-height: 38px; font-size: 14px; }
      dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; font-size: 13px; }
      dt { color: var(--soft); }
      dd { margin: 0; font-family: "JetBrains Mono", monospace; overflow-wrap: anywhere; }
      .hint { margin-top: auto; font-size: 12px; color: var(--soft); }
      .hint code { font-family: "JetBrains Mono", monospace; color: var(--text); }
      main { display: grid; place-items: center; padding: 32px; }
      .stage { position: relative; width: min(100%, 82vh, 860px); aspect-ratio: 1; border-radius: 6px; overflow: hidden; box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6); background: #000; }
      .stage canvas { display: block; width: 100%; height: 100%; }
      .busy { position: absolute; inset: auto 12px 12px auto; padding: 6px 12px; border-radius: 999px; background: rgba(0, 0, 0, 0.7); font-size: 12px; font-weight: 600; opacity: 0; transition: opacity 0.2s; }
      .busy.on { opacity: 1; }
      #gl { position: absolute; left: -99999px; top: 0; } /* the WebGL canvas renders off-screen; the poster canvas shows the result */
      @media (max-width: 860px) { .app { grid-template-columns: 1fr; } aside { border-right: 0; border-bottom: 1px solid var(--line); } }
    </style>
  </head>
  <body>
    <div class="app">
      <aside>
        <h1>Poster Generator <small id="brand-name">—</small></h1>

        <label>Brand
          <select id="brand"><option value="RIZON">RIZON</option><option value="ZELA">ZELA</option></select>
        </label>
        <label>Seed <input id="seed" value="rizon-001" spellcheck="false" autocomplete="off" /></label>
        <div class="row">
          <button id="prev" type="button">← Prev</button>
          <button id="next" type="button">Next →</button>
        </div>
        <label>Goal
          <select id="goal"><option value="">Any</option><optgroup label="Brand"><option>awareness</option><option>conversion</option><option>trust</option><option>convenience</option></optgroup>
            <optgroup label="Campaign"><option value="prize-pool">prize pool</option><option>referral</option><option>giveaway</option><option>launch</option></optgroup></select>
        </label>
        <fieldset class="campaign">
          <legend>Campaign <small>used by prize pool, referral &amp; giveaway posters</small></legend>
          <div class="row">
            <label>Prize pool <input id="c-prize" spellcheck="false" autocomplete="off" /></label>
            <label>Referral bonus <input id="c-bonus" spellcheck="false" autocomplete="off" /></label>
          </div>
          <div class="row">
            <label>Giveaway <input id="c-giveaway" spellcheck="false" autocomplete="off" /></label>
            <label>Ends <input id="c-ends" spellcheck="false" autocomplete="off" /></label>
          </div>
        </fieldset>
        <div class="row">
          <button id="render" type="button">Render seed</button>
          <button id="random" class="primary" type="button">Generate</button>
        </div>
        <button id="download" class="primary" type="button">Download PNG</button>

        <dl id="meta"></dl>

        <p class="hint">Same seed, brand and goal always give the same poster.<br />Batch: <code>node batch.js 50 RIZON launch</code></p>
      </aside>
      <main>
        <div class="stage">
          <canvas id="poster" width="1024" height="1024" aria-label="Generated poster"></canvas>
          <span class="busy" id="busy">Rendering…</span>
        </div>
      </main>
    </div>
    <canvas id="gl" width="1024" height="1024"></canvas>
    <script type="module" src="./generator.js"></script>
  </body>
</html>
